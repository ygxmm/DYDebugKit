name: Build DYDebugKit

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build DYDebugKit
    runs-on: macos-14

    steps:

      # ==================================================
      # Checkout
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # Xcode
      # ==================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select \
            --switch \
            /Applications/Xcode_15.4.app/Contents/Developer

          xcode-select -p

          xcodebuild -version


      # ==================================================
      # Check iOS SDK
      # ==================================================

      - name: Check iOS SDK
        shell: bash
        run: |
          set -e

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "================================"
          echo "iOS SDK"
          echo "================================"

          echo "SDK_PATH=$SDK_PATH"

          test -d "$SDK_PATH"

          echo

          xcrun --sdk iphoneos --show-sdk-version

          echo

          echo "SDK OK"


      # ==================================================
      # Dependencies
      # ==================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          brew install \
            ldid \
            dpkg


      # ==================================================
      # Install Theos
      # ==================================================

      - name: Install Theos
        shell: bash
        run: |
          set -e

          THEOS="$HOME/theos"

          rm -rf "$THEOS"

          git clone \
            --depth=1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          echo "$THEOS/bin" >> "$GITHUB_PATH"


      # ==================================================
      # Verify Theos
      # ==================================================

      - name: Verify Theos
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "Theos"
          echo "================================"

          echo "THEOS=$THEOS"

          test -d "$THEOS"

          test -f "$THEOS/makefiles/common.mk"

          echo "Theos OK"


      # ==================================================
      # Configure Theos SDK
      # ==================================================

      - name: Configure Theos SDK
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "Using SDK:"
          echo "$SDK_PATH"

          mkdir -p "$THEOS/sdks"

          SDK_NAME="$(basename "$SDK_PATH")"

          echo "SDK_NAME=$SDK_NAME"

          if [ ! -e "$THEOS/sdks/$SDK_NAME" ]; then
            ln -s "$SDK_PATH" "$THEOS/sdks/$SDK_NAME"
          fi

          echo
          echo "Theos SDK directory:"

          ls -la "$THEOS/sdks"


      # ==================================================
      # Check Project
      # ==================================================

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Project"
          echo "================================"

          find . \
            -maxdepth 2 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo

          test -f Makefile
          test -f control
          test -f DYDebugKit.plist

          test -f Entry.xm
          test -f DYDebugCapture.h
          test -f DYDebugCapture.m
          test -f DYDebugExport.h
          test -f DYDebugExport.m

          echo
          echo "Project structure OK"


      # ==================================================
      # Show Makefile
      # ==================================================

      - name: Check Makefile
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Makefile"
          echo "================================"

          cat Makefile


      # ==================================================
      # Build
      # ==================================================

      - name: Build package
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "================================"
          echo "Building DYDebugKit"
          echo "================================"

          make clean

          make package \
            FINALPACKAGE=1


      # ==================================================
      # Find DEB
      # ==================================================

      - name: Find package
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Generated packages"
          echo "================================"

          find packages \
            -type f \
            -name "*.deb" \
            -print

          PACKAGE="$(find packages \
            -type f \
            -name "*.deb" \
            -print \
            -quit)"

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No DEB generated."
            exit 1
          fi

          echo
          echo "Package:"
          echo "$PACKAGE"


      # ==================================================
      # Upload Artifact
      # ==================================================

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DYDebugKit-deb
          path: packages/*.deb
          if-no-files-found: error