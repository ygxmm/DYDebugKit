name: Build DYDebugKit

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Debian Package
    runs-on: macos-14

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Dependencies
      # --------------------------------------------------

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          brew update

          brew install \
            ldid \
            dpkg


      # --------------------------------------------------
      # Install Theos
      # --------------------------------------------------

      - name: Install Theos
        shell: bash
        run: |
          set -e

          THEOS="$HOME/theos"

          if [ -d "$THEOS" ]; then
            rm -rf "$THEOS"
          fi

          git clone \
            --depth=1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          echo "$THEOS/bin" >> "$GITHUB_PATH"


      # --------------------------------------------------
      # Verify Theos
      # --------------------------------------------------

      - name: Verify Theos
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "THEOS"
          echo "================================"

          echo "$THEOS"

          test -d "$THEOS"

          test -f "$THEOS/makefiles/common.mk"

          echo
          echo "Theos OK"


      # --------------------------------------------------
      # Check SDK
      # --------------------------------------------------

      - name: Check iOS SDK
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "SDK"
          echo "================================"

          SDK_COUNT=0

          while IFS= read -r sdk; do
            echo "$sdk"
            SDK_COUNT=$((SDK_COUNT + 1))
          done < <(
            find "$THEOS" \
              -type d \
              -name "iPhoneOS*.sdk" \
              -print
          )

          if [ "$SDK_COUNT" -eq 0 ]; then
            echo
            echo "No iPhoneOS SDK found in Theos."
            echo
            echo "The build cannot continue."
            exit 1
          fi


      # --------------------------------------------------
      # Check Project
      # --------------------------------------------------

      - name: Check project files
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Project"
          echo "================================"

          echo
          echo "Files:"

          find . \
            -maxdepth 2 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo

          test -f Makefile
          test -f control
          test -f DYDebugKit.plist

          test -f Entry.xm
          test -f DYDebugCapture.h
          test -f DYDebugCapture.m
          test -f DYDebugExport.h
          test -f DYDebugExport.m

          echo
          echo "Project structure OK"


      # --------------------------------------------------
      # Validate Makefile
      # --------------------------------------------------

      - name: Validate Makefile
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Makefile"
          echo "================================"

          grep -q "TWEAK_NAME = DYDebugKit" Makefile
          grep -q "Entry.xm" Makefile
          grep -q "DYDebugCapture.m" Makefile
          grep -q "DYDebugExport.m" Makefile

          echo "Makefile OK"


      # --------------------------------------------------
      # Build
      # --------------------------------------------------

      - name: Build package
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "================================"
          echo "Build"
          echo "================================"

          make clean

          make package \
            FINALPACKAGE=1


      # --------------------------------------------------
      # Locate DEB
      # --------------------------------------------------

      - name: Find package
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Packages"
          echo "================================"

          find packages \
            -type f \
            -name "*.deb" \
            -print

          PACKAGE="$(find packages \
            -type f \
            -name "*.deb" \
            -print \
            -quit)"

          if [ -z "$PACKAGE" ]; then
            echo
            echo "ERROR: No .deb package generated."
            exit 1
          fi

          echo
          echo "Generated:"
          echo "$PACKAGE"


      # --------------------------------------------------
      # Upload Artifact
      # --------------------------------------------------

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DYDebugKit-deb
          path: packages/*.deb
          if-no-files-found: error