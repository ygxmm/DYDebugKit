name: Build DYDebugKit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DYDebugKit
    runs-on: macos-14

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Xcode
      # ------------------------------------------------------------

      - name: Setup Xcode
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Xcode"
          echo "================================"

          sudo xcode-select \
            --switch \
            /Applications/Xcode_15.4.app/Contents/Developer

          xcode-select -p
          xcodebuild -version


      # ------------------------------------------------------------
      # iOS SDK
      # ------------------------------------------------------------

      - name: Check iPhoneOS SDK
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "iPhoneOS SDK"
          echo "================================"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "SDK:"
          echo "$SDK_PATH"

          echo
          echo "SDK Version:"
          echo "$SDK_VERSION"

          test -d "$SDK_PATH"


      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Dependencies"
          echo "================================"

          brew install ldid dpkg

          echo
          echo "ldid:"
          which ldid

          echo
          echo "dpkg:"
          which dpkg


      # ------------------------------------------------------------
      # Theos
      # ------------------------------------------------------------

      - name: Install Theos
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Install Theos"
          echo "================================"

          export THEOS="$HOME/theos"

          rm -rf "$THEOS"

          git clone \
            --depth=1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          test -d "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/package.mk"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo
          echo "Theos installed."


      # ------------------------------------------------------------
      # Theos dependencies
      # ------------------------------------------------------------

      - name: Install Theos dependencies
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "Theos Dependencies"
          echo "================================"

          # Theos uses these tools during compilation/packaging.
          brew install perl coreutils

          echo
          echo "Perl:"
          perl --version | head -2

          echo
          echo "Theos:"
          ls -la "$THEOS"


      # ------------------------------------------------------------
      # Link Apple's SDK into Theos
      # ------------------------------------------------------------

      - name: Configure iOS SDK
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "Configure iOS SDK"
          echo "================================"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_NAME="$(basename "$SDK_PATH")"

          echo "SDK_PATH=$SDK_PATH"
          echo "SDK_NAME=$SDK_NAME"

          mkdir -p "$THEOS/sdks"

          rm -rf "$THEOS/sdks/$SDK_NAME"

          ln -s \
            "$SDK_PATH" \
            "$THEOS/sdks/$SDK_NAME"

          echo
          echo "Theos SDKs:"
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type l \
            -print


      # ------------------------------------------------------------
      # Verify Theos
      # ------------------------------------------------------------

      - name: Verify Theos
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "Verify Theos"
          echo "================================"

          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/tweak.mk"
          test -f "$THEOS/makefiles/package.mk"

          echo
          echo "Theos:"
          echo "$THEOS"

          echo
          echo "SDK:"
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type l \
            -print


      # ------------------------------------------------------------
      # Project structure
      # ------------------------------------------------------------

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Project"
          echo "================================"

          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo
          echo "Required files..."

          test -f Makefile
          test -f control
          test -f DYDebugKit.plist

          test -f Entry.xm

          test -f DYDebugCapture.h
          test -f DYDebugCapture.m

          test -f DYDebugExport.h
          test -f DYDebugExport.m

          echo
          echo "Project structure OK."


      # ------------------------------------------------------------
      # Makefile
      # ------------------------------------------------------------

      - name: Validate Makefile
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Makefile"
          echo "================================"

          cat Makefile

          echo

          grep -q "TWEAK_NAME" Makefile

          echo
          echo "Makefile OK."


      # ------------------------------------------------------------
      # control
      # ------------------------------------------------------------

      - name: Validate control
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "control"
          echo "================================"

          cat control

          echo

          grep -q "^Package:" control
          grep -q "^Version:" control
          grep -q "^Architecture:" control

          echo
          echo "control OK."


      # ------------------------------------------------------------
      # plist
      # ------------------------------------------------------------

      - name: Validate plist
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "plist"
          echo "================================"

          cat DYDebugKit.plist

          echo

          plutil -lint DYDebugKit.plist

          echo
          echo "plist OK."


      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build package
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "================================"
          echo "Build DYDebugKit"
          echo "================================"

          echo
          echo "THEOS=$THEOS"

          echo
          echo "Cleaning..."

          make clean

          echo
          echo "Building..."

          make package FINALPACKAGE=1

          echo
          echo "Build completed."


      # ------------------------------------------------------------
      # Find DEB
      # ------------------------------------------------------------

      - name: Find package
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Package"
          echo "================================"

          find packages \
            -type f \
            -print \
            | sort

          PACKAGE="$(find packages \
            -type f \
            -name "*.deb" \
            -print \
            -quit)"

          if [ -z "$PACKAGE" ]; then
            echo
            echo "ERROR: No .deb package found."
            exit 1
          fi

          echo
          echo "DEB:"
          echo "$PACKAGE"

          echo
          ls -lh "$PACKAGE"

          echo
          file "$PACKAGE"


      # ------------------------------------------------------------
      # Artifact
      # ------------------------------------------------------------

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DYDebugKit-deb
          path: packages/*.deb
          if-no-files-found: error


      # ------------------------------------------------------------
      # Diagnostic artifact
      # ------------------------------------------------------------

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DYDebugKit-build-output
          path: |
            packages/**
            .theos/**
          if-no-files-found: ignore