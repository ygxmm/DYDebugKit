name: Build DYDebugKit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build DYDebugKit
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Xcode
      # -----------------------------

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select \
            --switch \
            /Applications/Xcode_15.4.app/Contents/Developer

          xcode-select -p
          xcodebuild -version

      # -----------------------------
      # Dependencies
      # -----------------------------

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          brew install \
            ldid \
            dpkg \
            perl

      # -----------------------------
      # Install Theos
      # -----------------------------

      - name: Install Theos
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          rm -rf "$THEOS"

          git clone \
            --depth=1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      # -----------------------------
      # Inspect Theos
      # -----------------------------

      - name: Inspect Theos
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "THEOS:"
          echo "$THEOS"

          echo
          echo "Theos root:"
          ls -la "$THEOS"

          echo
          echo "Packaging related files:"
          find "$THEOS" \
            -type f \
            \( \
              -name "dm.pl" \
              -o -name "dpkg-deb" \
              -o -name "package.mk" \
            \) \
            -print

      # -----------------------------
      # Check Xcode SDK
      # -----------------------------

      - name: Check iOS SDK
        shell: bash
        run: |
          set -e

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "SDK:"
          echo "$SDK_PATH"

          test -d "$SDK_PATH"

          echo
          xcrun --sdk iphoneos --show-sdk-version

      # -----------------------------
      # Configure Theos SDK
      # -----------------------------

      - name: Configure Theos SDK
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_NAME="$(basename "$SDK_PATH")"

          mkdir -p "$THEOS/sdks"

          ln -sfn \
            "$SDK_PATH" \
            "$THEOS/sdks/$SDK_NAME"

          echo
          echo "Theos SDK:"
          ls -la "$THEOS/sdks"

      # -----------------------------
      # Check project
      # -----------------------------

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "Project files:"
          find . \
            -maxdepth 2 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo

          test -f Makefile
          test -f control
          test -f DYDebugKit.plist

          test -f Entry.xm
          test -f DYDebugCapture.h
          test -f DYDebugCapture.m
          test -f DYDebugExport.h
          test -f DYDebugExport.m

      # -----------------------------
      # Check Makefile
      # -----------------------------

      - name: Check Makefile
        shell: bash
        run: |
          set -e

          cat Makefile

          grep -q "TWEAK_NAME = DYDebugKit" Makefile
          grep -q "Entry.xm" Makefile
          grep -q "DYDebugCapture.m" Makefile
          grep -q "DYDebugExport.m" Makefile

      # -----------------------------
      # Check dm.pl
      # -----------------------------

      - name: Check dm.pl
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          DM_PL="$(find "$THEOS" \
            -type f \
            -name "dm.pl" \
            -print \
            -quit)"

          if [ -z "$DM_PL" ]; then
            echo "ERROR: dm.pl is missing from this Theos checkout."
            echo
            echo "Theos packaging files:"
            find "$THEOS" \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          echo "dm.pl:"
          echo "$DM_PL"

          chmod +x "$DM_PL"

      # -----------------------------
      # Build
      # -----------------------------

      - name: Build package
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          make clean

          make package \
            FINALPACKAGE=1

      # -----------------------------
      # Find package
      # -----------------------------

      - name: Find package
        shell: bash
        run: |
          set -e

          echo "Packages:"

          find packages \
            -type f \
            -name "*.deb" \
            -print

          PACKAGE="$(find packages \
            -type f \
            -name "*.deb" \
            -print \
            -quit)"

          test -n "$PACKAGE"

          echo
          echo "Generated:"
          echo "$PACKAGE"

      # -----------------------------
      # Upload
      # -----------------------------

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DYDebugKit-deb
          path: packages/*.deb
          if-no-files-found: error