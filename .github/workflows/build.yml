name: Build DYDebugKit

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DYDebugKit
    runs-on: macos-14

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Xcode
      # ============================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Xcode"
          echo "================================"

          XCODE="/Applications/Xcode_15.4.app/Contents/Developer"

          if [ ! -d "$XCODE" ]; then
            echo "Xcode 15.4 not found."

            echo
            echo "Available Xcode:"
            ls -la /Applications | grep Xcode || true

            exit 1
          fi

          sudo xcode-select --switch "$XCODE"

          echo
          echo "Developer:"
          xcode-select -p

          echo
          echo "Version:"
          xcodebuild -version


      # ============================================================
      # SDK
      # ============================================================

      - name: Check iOS SDK
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "iPhoneOS SDK"
          echo "================================"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "SDK_PATH=$SDK_PATH"
          echo "SDK_VERSION=$SDK_VERSION"

          test -d "$SDK_PATH"


      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Dependencies"
          echo "================================"

          brew update

          brew install \
            ldid \
            dpkg \
            perl \
            coreutils

          echo
          echo "ldid:"
          command -v ldid

          echo
          echo "dpkg:"
          command -v dpkg

          echo
          echo "perl:"
          command -v perl


      # ============================================================
      # Theos
      # ============================================================

      - name: Install Theos
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Theos"
          echo "================================"

          export THEOS="$HOME/theos"

          rm -rf "$THEOS"

          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/theos/theos.git \
            "$THEOS"

          cd "$THEOS"

          git submodule update \
            --init \
            --recursive

          echo
          echo "Theos commit:"
          git rev-parse HEAD

          echo
          echo "Theos directory:"
          ls -la "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"


      # ============================================================
      # Verify Theos
      # ============================================================

      - name: Verify Theos
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "Verify Theos"
          echo "================================"

          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/tweak.mk"
          test -f "$THEOS/makefiles/package.mk"

          echo
          echo "Theos:"
          echo "$THEOS"

          echo
          echo "Makefiles:"
          ls -la "$THEOS/makefiles"


      # ============================================================
      # Configure SDK
      # ============================================================

      - name: Configure Theos SDK
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "Configure SDK"
          echo "================================"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_NAME="$(basename "$SDK_PATH")"

          echo "SDK_PATH=$SDK_PATH"
          echo "SDK_NAME=$SDK_NAME"

          mkdir -p "$THEOS/sdks"

          rm -rf "$THEOS/sdks/$SDK_NAME"

          ln -s \
            "$SDK_PATH" \
            "$THEOS/sdks/$SDK_NAME"

          echo
          echo "Theos SDK:"
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -print


      # ============================================================
      # Check project
      # ============================================================

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Project"
          echo "================================"

          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo
          echo "Checking required files..."

          test -f Makefile
          test -f control
          test -f DYDebugKit.plist

          test -f Entry.xm

          test -f DYDebugCapture.h
          test -f DYDebugCapture.m

          test -f DYDebugExport.h
          test -f DYDebugExport.m

          echo
          echo "Project structure OK."


      # ============================================================
      # Check Makefile
      # ============================================================

      - name: Validate Makefile
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Makefile"
          echo "================================"

          cat Makefile

          echo

          grep -q "^TARGET =" Makefile
          grep -q "^ARCHS =" Makefile
          grep -q "^TWEAK_NAME = DYDebugKit" Makefile

          echo
          echo "Makefile OK."


      # ============================================================
      # Check control
      # ============================================================

      - name: Validate control
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "control"
          echo "================================"

          cat control

          echo

          grep -q "^Package:" control
          grep -q "^Version:" control
          grep -q "^Architecture:" control

          echo
          echo "control OK."


      # ============================================================
      # Check plist
      # ============================================================

      - name: Validate plist
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "DYDebugKit.plist"
          echo "================================"

          cat DYDebugKit.plist

          echo

          plutil -lint DYDebugKit.plist

          echo
          echo "plist OK."


      # ============================================================
      # Check packaging tools
      # ============================================================

      - name: Check packaging environment
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "Packaging"
          echo "================================"

          echo
          echo "dpkg:"
          dpkg --version

          echo
          echo "Theos package.mk:"
          test -f "$THEOS/makefiles/package.mk"

          echo
          echo "Searching for dm.pl..."

          DM_PL="$(find "$THEOS" \
            -type f \
            -name "dm.pl" \
            -print \
            -quit || true)"

          if [ -n "$DM_PL" ]; then
            echo "dm.pl found:"
            echo "$DM_PL"
          else
            echo "dm.pl not found in Theos checkout."
          fi


      # ============================================================
      # Build
      # ============================================================

      - name: Build DYDebugKit
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "================================"
          echo "Build DYDebugKit"
          echo "================================"

          echo
          echo "THEOS=$THEOS"

          echo
          echo "Cleaning..."

          make clean

          echo
          echo "Building..."

          make package FINALPACKAGE=1

          echo
          echo "Build completed."


      # ============================================================
      # Find package
      # ============================================================

      - name: Find DEB
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "DEB Package"
          echo "================================"

          if [ ! -d packages ]; then
            echo "packages directory does not exist."
            exit 1
          fi

          find packages \
            -type f \
            -print \
            | sort

          PACKAGE="$(find packages \
            -type f \
            -name "*.deb" \
            -print \
            -quit)"

          if [ -z "$PACKAGE" ]; then
            echo
            echo "ERROR: No DEB package generated."
            exit 1
          fi

          echo
          echo "Package:"
          echo "$PACKAGE"

          echo
          ls -lh "$PACKAGE"

          echo
          file "$PACKAGE"


      # ============================================================
      # Upload
      # ============================================================

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DYDebugKit-deb
          path: packages/*.deb
          if-no-files-found: error